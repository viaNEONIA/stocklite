<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StockLite</title><meta name="theme-color" content="#174fdb"><meta name="description" content="数量とタグを管理するオフライン対応在庫アプリ"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><style>:root{font-family:system-ui,sans-serif;color-scheme:light}body{margin:0;background:#f4f6f8;color:#17212b}header{padding:18px 16px;background:white;font-size:21px;font-weight:750}main{padding:12px 12px 110px;max-width:600px;margin:auto}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px;background:#e5eaf0;color:#17212b}button.primary{background:#174fdb;color:white}button.good{background:#16845a;color:white}button.warn{background:#b05a18;color:white}.bar,.item,.panel{background:white;border-radius:15px;padding:12px;margin-bottom:10px}.bar{display:flex;gap:8px}.bar input{min-width:0;flex:1}.item{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{font-size:12px;color:#687687}.qty{font-size:22px;font-weight:700}.tags{font-size:12px;color:#4763a2}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;box-shadow:0 -2px 15px #0001}.bottom button{flex:1}.hidden{display:none!important}label{display:block;margin:12px 0 5px;font-size:13px}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cdd5df;border-radius:10px;background:white}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}#video{width:100%;height:230px;object-fit:cover;background:#18202a;border-radius:14px}#status{font-size:13px;min-height:20px}#toast{position:fixed;top:10px;right:10px;background:#243746;color:white;padding:10px;border-radius:10px;display:none;z-index:3}</style></head><body><header>StockLite <span class="muted">数量・タグ管理</span></header><div id="toast"></div><main><section id="home"><div class="bar"><input id="search" placeholder="名前・タグ・コードで検索"><button onclick="show('edit');resetForm()">＋</button></div><div class="panel"><strong id="summary"></strong><div class="muted">変更内容は端末内に自動保存されます</div></div><div id="list"></div></section><section id="edit" class="hidden"><h3>品目登録・編集</h3><input type="hidden" id="id"><label>品名</label><input id="name"><label>バーコード / QRコード内容</label><input id="code"><label>タグ（カンマ区切り）</label><input id="tags"><label>在庫数量</label><input id="quantity" type="number" min="0" step="1"><div class="actions"><button onclick="show('home')">戻る</button><button class="primary" onclick="saveItem()">保存</button></div><div class="actions"><button onclick="removeItem()">この品目を削除</button></div></section><section id="scan" class="hidden"><h3>連続スキャン</h3><div class="bar"><button id="buy" class="good" onclick="setMode('buy')">購入 ＋</button><button id="use" onclick="setMode('use')">使用 −</button><input id="delta" type="number" min="1" step="1" value="1" aria-label="変更数量" style="max-width:85px"></div><video id="video" playsinline muted></video><button id="retryCamera" class="hidden" onclick="startScan()">カメラを再試行</button><p id="status">カメラを準備しています</p><div class="bar"><input id="manual" placeholder="コード手入力"><button onclick="handleCode(document.getElementById('manual').value)">確定</button></div><button onclick="stopScan();show('home')">スキャン終了</button></section><section id="history" class="hidden"><h3>操作履歴</h3><div id="logs"></div></section><section id="settings" class="hidden"><h3>データ管理</h3><p class="muted">JSONバックアップは手動で出力します。ブラウザ内の変更は自動保存されます。</p><button onclick="exportJson()">JSONを書き出す</button><label>JSONを読み込む（現在のデータと置換）</label><input type="file" accept=".json,application/json" id="import" onchange="importJson(event)"></section></main><nav class="bottom"><button onclick="stopScan();show('home')">在庫</button><button class="primary" onclick="show('scan');startScan()">スキャン</button><button onclick="stopScan();show('history')">履歴</button><button onclick="stopScan();show('settings')">設定</button></nav><script>
const $=id=>document.getElementById(id);let db,items=[],logs=[],mode='buy',stream=null,detector=null,scanning=false,lastCode='',lastTime=0,scanBusy=false,startingCamera=false;const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1700)}
async function init(){db=await new Promise((resolve,reject)=>{const r=indexedDB.open('stocklite',1);r.onupgradeneeded=()=>{r.result.createObjectStore('state')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});const saved=await new Promise(resolve=>{const r=db.transaction('state').objectStore('state').get('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)});items=saved?.items||[];logs=saved?.logs||[];render()}
function persist(){return new Promise((resolve,reject)=>{const tx=db.transaction('state','readwrite');tx.objectStore('state').put({items,logs,version:1},'data');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function show(s){for(const id of ['home','edit','scan','history','settings'])$(id).classList.toggle('hidden',id!==s);if(s==='home')render();if(s==='history')renderLogs()}
function render(){const q=$('search').value.toLowerCase();$('summary').textContent=`${items.length}品目 / 合計 ${items.reduce((a,x)=>a+x.quantity,0)}個`;$('list').innerHTML=items.filter(x=>[x.name,x.code,...x.tags].join(' ').toLowerCase().includes(q)).map(x=>`<div class="item"><div><b>${escapeHtml(x.name)}</b><div class="tags">${x.tags.map(escapeHtml).join(' / ')}</div><div class="muted">${escapeHtml(x.code)}</div></div><div class="qty">${x.quantity}</div><button data-edit="${escapeHtml(x.id)}">編集</button></div>`).join('')||'<p class="muted">該当する品目はありません</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editItem(b.dataset.edit))}
$('search').oninput=render;function resetForm(code=''){$('id').value='';$('name').value='';$('code').value=code;$('tags').value='';$('quantity').value='0'}function editItem(id){const x=items.find(x=>x.id===id);if(!x)return;$('id').value=x.id;$('name').value=x.name;$('code').value=x.code;$('tags').value=x.tags.join(', ');$('quantity').value=x.quantity;show('edit')}
async function saveItem(){const name=$('name').value.trim(),code=$('code').value.trim(),quantity=Number($('quantity').value);if(!name||!Number.isSafeInteger(quantity)||quantity<0)return toast('品名と数量を確認してください');if(code&&items.some(x=>x.code===code&&x.id!==$('id').value))return toast('コードが重複しています');const id=$('id').value||crypto.randomUUID(),old=items.find(x=>x.id===id),x={id,name,code,tags:[...new Set($('tags').value.split(',').map(s=>s.trim()).filter(Boolean))],quantity};items=old?items.map(y=>y.id===id?x:y):[...items,x];logs.unshift({at:new Date().toISOString(),type:old?'edit':'create',id,name,before:old?.quantity??null,after:quantity});await persist();toast('保存しました');show('home')}
async function removeItem(){const id=$('id').value;if(!id)return;const x=items.find(x=>x.id===id);if(!x||!confirm('この品目を削除しますか？'))return;items=items.filter(x=>x.id!==id);logs.unshift({at:new Date().toISOString(),type:'delete',id,name:x.name,before:x.quantity,after:null});await persist();show('home')}
function setMode(m){mode=m;$('buy').className=m==='buy'?'good':'';$('use').className=m==='use'?'warn':''}
async function handleCode(raw){const code=String(raw).trim(),n=Number($('delta').value);if(!code||scanBusy)return;if(!Number.isSafeInteger(n)||n<=0)return toast('変更数量を確認してください');const now=Date.now();if(code===lastCode&&now-lastTime<1800)return;scanBusy=true;lastCode=code;lastTime=now;try{const x=items.find(x=>x.code===code);if(!x){$('status').textContent='未登録コード: '+code;toast('未登録コードです');stopScan();resetForm(code);show('edit');return}if(mode==='use'&&x.quantity<n){$('status').textContent='在庫不足: '+x.name;toast('在庫不足');return}const before=x.quantity;x.quantity+=mode==='buy'?n:-n;logs.unshift({at:new Date().toISOString(),type:mode,id:x.id,name:x.name,before,after:x.quantity,delta:n});await persist();$('status').textContent=`${x.name}: ${before} → ${x.quantity}（${mode==='buy'?'+':'−'}${n}）`;navigator.vibrate?.(60)}catch(e){toast('保存に失敗しました')}finally{scanBusy=false}}
async function startScan(){if(stream||startingCamera)return;startingCamera=true;$('retryCamera').classList.add('hidden');setMode(mode);if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){$('status').textContent='カメラにはHTTPSまたはlocalhostでの起動が必要です。GitHub PagesのURLから開いてください。';$('retryCamera').classList.remove('hidden');startingCamera=false;return}if(!('BarcodeDetector'in window)){$('status').textContent='このブラウザはバーコード検出に未対応です。対応するChromeで開くか手入力をご利用ください。';startingCamera=false;return}try{const formats=await BarcodeDetector.getSupportedFormats();const wanted=['qr_code','data_matrix','ean_13','ean_8','code_128','upc_a','upc_e','pdf417','aztec'].filter(f=>formats.includes(f));if(!wanted.length)throw Error('対応コードなし');detector=new BarcodeDetector({formats:wanted});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('video').srcObject=stream;await $('video').play();scanning=true;$('status').textContent='コードをカメラに映してください';scanLoop()}catch(e){stream?.getTracks().forEach(t=>t.stop());stream=null;const msg=e.name==='NotAllowedError'||e.name==='PermissionDeniedError'?'カメラへのアクセスが拒否されました。Chromeのサイト設定からカメラを許可してください。':e.name==='NotFoundError'?'カメラが見つかりません。':e.name==='NotReadableError'?'他のアプリがカメラを使用している可能性があります。':'カメラを起動できません: '+e.message;$('status').textContent=msg;$('retryCamera').classList.remove('hidden')}finally{startingCamera=false}}
async function scanLoop(){while(scanning){try{const found=await detector.detect($('video'));if(found.length)await handleCode(found[0].rawValue)}catch(e){}await new Promise(r=>setTimeout(r,180))}}
function stopScan(){scanning=false;stream?.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;lastCode='';lastTime=0}
function renderLogs(){$('logs').innerHTML=logs.slice(0,300).map(x=>`<div class="item"><div><b>${escapeHtml(x.name)}</b><div class="muted">${new Date(x.at).toLocaleString('ja-JP')} / ${escapeHtml(x.type)}</div></div><div>${x.before??'—'} → ${x.after??'—'}</div></div>`).join('')||'<p>履歴なし</p>'}
function exportJson(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),items,logs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stocklite-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importJson(e){const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.items)||!Array.isArray(data.logs)||!data.items.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&typeof x.code==='string'&&Array.isArray(x.tags)&&x.tags.every(t=>typeof t==='string')&&Number.isSafeInteger(x.quantity)&&x.quantity>=0))throw Error('JSON形式が不正です');if(!confirm('現在の全データを置き換えますか？'))return;items=data.items;logs=data.logs;await persist();render();toast('読み込み完了')}catch(err){toast('読み込み失敗: '+err.message)}finally{e.target.value=''}}if('serviceWorker' in navigator&&window.isSecureContext){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('オフライン登録失敗',e)))}init().catch(e=>alert('データベース起動失敗: '+e.message));
</script></body></html>
