<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>StockLite</title><style>:root{font-family:system-ui,sans-serif;color-scheme:light}body{margin:0;background:#f4f6f8;color:#17212b}header{padding:18px 16px;background:white;font-size:21px;font-weight:750}main{padding:12px 12px 110px;max-width:600px;margin:auto}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px;background:#e5eaf0;color:#17212b}button.primary{background:#174fdb;color:white}button.good{background:#16845a;color:white}button.warn{background:#b05a18;color:white}.bar,.item,.panel{background:white;border-radius:15px;padding:12px;margin-bottom:10px}.bar{display:flex;gap:8px}.bar input{min-width:0;flex:1}.item{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{font-size:12px;color:#687687}.qty{font-size:22px;font-weight:700}.tags{font-size:12px;color:#4763a2}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;box-shadow:0 -2px 15px #0001}.bottom button{flex:1}.hidden{display:none!important}label{display:block;margin:12px 0 5px;font-size:13px}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cdd5df;border-radius:10px;background:white}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}#video{width:100%;height:230px;object-fit:cover;background:#18202a;border-radius:14px}#status{font-size:13px;min-height:20px}#toast{position:fixed;top:10px;right:10px;background:#243746;color:white;padding:10px;border-radius:10px;display:none;z-index:3}#confirmBox{position:fixed;z-index:5;left:12px;right:12px;bottom:calc(82px + env(safe-area-inset-bottom));max-width:560px;margin:auto;background:white;border:2px solid #174fdb;border-radius:18px;padding:16px;box-shadow:0 8px 40px #0005}#confirmBox .actions button{min-height:52px}#scan .bar button{min-height:4 #pending{margin:12px 0;border:2px solid #2777cf}#pending .bar{display:flex;align-items:center;justify-content:center;gap:12px}#pendingQty{width:90px;text-align:center;font-size:23px}#pending .bar button{font-size:24px;min-width:55px}.hidden{display:none!important}button:disabled{opacity:.5}#status{min-height:2em}</style><script defer="" src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js">const $=id=>document.getElementById(id);let frameCanvas=document.createElement('canvas'),db,items=[],logs=[],mode='buy',stream=null,detector=null,scanning=false,scanBusy=false,pending=null,seenCode='',seenAt=0,waitForClear=false,clearFrames=0,scanSession=0,saveQueue=Promise.resolve(),lastBackup=localStorage.getItem('stocklite-backup')||'';

function validItems(arr){if(!Array.isArray(arr)||arr.length>100000)throw Error('品目配列が不正');const ids=new Set(),codes=new Set();for(const x of arr){if(!x||typeof x!=='object'||typeof x.id!=='string'||!x.id||ids.has(x.id)||typeof x.name!=='string'||!x.name.trim()||typeof x.code!=='string'||!Array.isArray(x.tags)||!x.tags.every(t=>typeof t==='string')||!Number.isSafeInteger(x.quantity)||x.quantity<0)throw Error('品目データが不正またはID重複');ids.add(x.id);if(x.code){if(codes.has(x.code))throw Error('コード重複');codes.add(x.code)}}}

async function init(){db=await new Promise((resolve,reject)=>{const r=indexedDB.open('stocklite',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('state'))r.result.createObjectStore('state')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});const saved=await new Promise((resolve,reject)=>{const r=db.transaction('state').objectStore('state').get('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(saved){validItems(saved.items);validLogs(saved.logs);items=saved.items;logs=saved.logs}render();updateBackupState()}

function render(){const q=$('search').value.toLowerCase();$('summary').textContent=`${items.length}品目 / 合計 ${items.reduce((a,x)=>a+x.quantity,0)}個`;$('list').innerHTML=items.filter(x=>[x.name,x.code,...x.tags].join(' ').toLowerCase().includes(q)).map(x=>`<div class="item"><div><b>${escapeHtml(x.name)}</b><div class="tags">${x.tags.map(escapeHtml).join(' / ')}</div><div class="muted">${escapeHtml(x.code)}</div></div><div class="qty">${x.quantity}</div><button data-edit="${escapeHtml(x.id)}">編集</button></div>`).join('')||'<p class="muted">該当する品目はありません</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editItem(b.dataset.edit))}
$('search').oninput=render;function resetForm(code=''){$('id').value='';$('name').value='';$('code').value=code;$('tags').value='';$('quantity').value='0'}function editItem(id){const x=items.find(x=>x.id===id);if(!x)return;$('id').value=x.id;$('name').value=x.name;$('code').value=x.code;$('tags').value=x.tags.join(', ');$('quantity').value=x.quantity;show('edit')}
async function saveItem(){const name=$('name').value.trim(),code=$('code').value.trim(),quantity=Number($('quantity').value);if(!name||!Number.isSafeInteger(quantity)||quantity<0)return toast('品名と数量を確認してください');if(code&&items.some(x=>x.code===code&&x.id!==$('id').value))return toast('コードが重複しています');const id=$('id').value||crypto.randomUUID(),old=items.find(x=>x.id===id),x={id,name,code,tags:[...new Set($('tags').value.split(',').map(s=>s.trim()).filter(Boolean))],quantity};const prev=items,prevLogs=logs;items=old?items.map(y=>y.id===id?x:y):[...items,x];logs=[{at:new Date().toISOString(),type:old?'edit':'create',id,name,before:old?.quantity??null,after:quantity},...logs];try{await persist();toast('自動保存しました');show('home')}catch(e){items=prev;logs=prevLogs;toast('保存失敗: '+e.message)}}
async function removeItem(){const id=$('id').value;if(!id)return;const x=items.find(x=>x.id===id);if(!x||!confirm('この品目を削除しますか？'))return;const prev=items,prevLogs=logs;items=items.filter(x=>x.id!==id);logs=[{at:new Date().toISOString(),type:'delete',id,name:x.name,before:x.quantity,after:null},...logs];try{await persist();show('home')}catch(e){items=prev;logs=prevLogs;toast('保存失敗')}}
function setMode(m){if(pending)return toast('先に数量を確定またはキャンセルしてください');mode=m;$('buy').className=m==='buy'?'good':'';$('use').className=m==='use'?'warn':''}

function updatePending(){if(!pending)return;const x=items.find(x=>x.id===pending.id),n=qty();$('pendingDetail').textContent=`現在庫 ${x?.quantity??'不明'} → ${x&&n!==null?x.quantity+(pending.mode==='buy'?n:-n):'—'} / ${pending.mode==='buy'?'購入':'使用'}`;$('commitBtn').disabled=!x||n===null||pending.mode==='use'&&x.quantity<n}

function handleCode(raw){const code=String(raw??'').trim();if(!code||scanBusy||pending)return;const now=Date.now();if(waitForClear&&code===seenCode)return;if(code===seenCode&&now-seenAt<1200)return;seenCode=code;seenAt=now;waitForClear=true;clearFrames=0;const x=items.find(x=>x.code===code);if(!x){$('status').textContent='未登録コード: '+code;toast('未登録コードです');stopScan();resetForm(code);show('edit');return}pending={id:x.id,code,mode};$('pendingName').textContent=x.name;$('pendingQty').value=$('delta').value||'1';$('pending').classList.remove('hidden');$('status').textContent='数量を確認して確定してください';updatePending();navigator.vibrate?.(40)}
function cancelPending(){pending=null;$('pending').classList.add('hidden');$('status').textContent='次のコードを映してください'}
async function commitPending(){if(!pending||scanBusy)return;const x=items.find(x=>x.id===pending.id),n=qty();if(!x||n===null||pending.mode==='use'&&x.quantity<n)return toast('数量または在庫を確認してください');scanBusy=true;$('commitBtn').disabled=true;const before=x.quantity,after=before+(pending.mode==='buy'?n:-n);x.quantity=after;const log={at:new Date().toISOString(),type:pending.mode,id:x.id,name:x.name,before,after,delta:n};logs.unshift(log);try{await persist();$('status').textContent=`保存完了: ${x.name} ${before} → ${after}`;navigator.vibrate?.(65);pending=null;$('pending').classList.add('hidden')}catch(e){x.quantity=before;logs=logs.filter(v=>v!==log);toast('保存失敗: '+e.message)}finally{scanBusy=false;if(pending)updatePending()}}

async function loadZXing(){if(window.ZXingBrowser)return true;return await new Promise(resolve=>{const t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';t.onload=()=>resolve(!!window.ZXingBrowser);t.onerror=()=>resolve(false);document.head.appendChild(t)})}
async function startScan(){if(stream)return;setMode(mode);if(!navigator.mediaDevices?.getUserMedia){$('status').textContent='カメラにはHTTPSまたはlocalhostが必要です';return}const session=++scanSession;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(session!==scanSession){stream.getTracks().forEach(t=>t.stop());stream=null;return}$('video').srcObject=stream;await $('video').play();scanning=true;$('status').textContent='読み取りエンジンを準備中';if('BarcodeDetector'in window){try{const formats=await BarcodeDetector.getSupportedFormats();const wanted=['qr_code','data_matrix','ean_13','ean_8','code_128','upc_a','upc_e','pdf417','aztec'].filter(f=>formats.includes(f));if(wanted.length)detector=new BarcodeDetector({formats:wanted})}catch(e){}}if(!detector){if(await loadZXing()&&window.ZXingBrowser?.BrowserMultiFormatReader){detector=new ZXingBrowser.BrowserMultiFormatReader();detector._zxing=true}else throw Error('読み取りライブラリの取得に失敗しました（ネット接続を確認）')}if(session!==scanSession)return;$('status').textContent='コードをカメラに映してください';scanLoop(session)}catch(e){$('status').textContent='カメラ起動失敗: '+e.message;stopScan()}}
async function scanLoop(session){while(scanning&&session===scanSession){try{let code='';if(detector._zxing){try{const v=$('video');if(v.videoWidth&&v.videoHeight){frameCanvas.width=v.videoWidth;frameCanvas.height=v.videoHeight;frameCanvas.getContext('2d',{willReadFrequently:true}).drawImage(v,0,0);const result=detector.decodeFromCanvas(frameCanvas);code=result?.getText?.()||''}}catch(e){}}else{const found=await detector.detect($('video'));code=found[0]?.rawValue||''}if(code){clearFrames=0;handleCode(code)}else if(++clearFrames>=4)waitForClear=false}catch(e){}await new Promise(r=>setTimeout(r,220))}}

function renderLogs(){$('logs').innerHTML=logs.slice(0,300).map(x=>`<div class="item"><div><b>${escapeHtml(x.name)}</b><div class="muted">${new Date(x.at).toLocaleString('ja-JP')} / ${escapeHtml(x.type)}</div></div><div>${x.before??'—'} → ${x.after??'—'}</div></div>`).join('')||'<p>履歴なし</p>'}
function updateBackupState(){if($('backupState'))$('backupState').textContent=lastBackup?'前回のJSON出力: '+new Date(lastBackup).toLocaleString('ja-JP'):'JSONバックアップはまだ出力されていません'}
async function exportJson(){try{await saveQueue;const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),items,logs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stocklite-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);lastBackup=new Date().toISOString();localStorage.setItem('stocklite-backup',lastBackup);updateBackupState();toast('JSON出力を開始しました。保存先を確認してください')}catch(e){toast('バックアップ出力失敗')}}
async function importJson(e){const f=e.target.files?.[0];if(!f)return;try{if(f.size>30*1024*1024)throw Error('ファイルが大きすぎます');const data=JSON.parse(await f.text());if(![1,2].includes(data.version))throw Error('非対応バージョン');validItems(data.items);validLogs(data.logs);if(!confirm('現在の全データを置き換えますか？ 事前のバックアップを推奨します。'))return;await saveQueue;await persistSnapshot({version:2,items:data.items,logs:data.logs});items=data.items;logs=data.logs;render();toast('JSON読み込み完了')}catch(err){toast('読み込み失敗: '+err.message)}finally{e.target.value=''}}
init().catch(e=>alert('データベース起動失敗: '+e.message));</script></head><body><header>StockLite <span class="muted">数量・タグ管理</span></header><div id="toast"></div><main><section id="home"><div class="bar"><input id="search" placeholder="名前・タグ・コードで検索"/><button onclick="show('edit');resetForm()">＋</button></div><div class="panel"><strong id="summary"></strong><div class="muted">変更内容は端末内に自動保存されます</div></div><div id="list"></div></section><section class="hidden" id="edit"><h3>品目登録・編集</h3><input id="id" type="hidden"/><label>品名</label><input id="name"/><label>バーコード / QRコード内容</label><input id="code"/><label>タグ（カンマ区切り）</label><input id="tags"/><label>在庫数量</label><input id="quantity" min="0" step="1" type="number"/><div class="actions"><button onclick="show('home')">戻る</button><button class="primary" onclick="saveItem()">保存</button></div><div class="actions"><button onclick="removeItem()">この品目を削除</button></div></section><section class="hidden" id="scan"><h3>連続スキャン</h3><div class="bar"><button class="good" id="buy" onclick="setMode('buy')">購入 ＋</button><button id="use" onclick="setMode('use')">使用 −</button><input aria-label="変更数量" id="delta" min="1" step="1" style="max-width:85px" type="number" value="1"/></div><video id="video" muted="" playsinline=""></video><div class="panel hidden" id="pending"><b id="pendingName"></b><p class="muted" id="pendingDetail"></p><div class="bar"><button onclick="adjustDelta(-1)">−</button><input aria-label="確定数量" id="pendingQty" inputmode="numeric" min="1" step="1" type="number" value="1"/><button onclick="adjustDelta(1)">＋</button></div><div class="actions"><button onclick="cancelPending()">キャンセル</button><button class="primary" id="commitBtn" onclick="commitPending()">数量を確定</button></div></div><p id="status" role="status">カメラを準備しています</p><div aria-label="数量変更の確認" class="hidden" id="confirmBox" role="dialog"><b id="confirmName"></b><p class="muted" id="confirmStock"></p><label>変更数量</label><input id="confirmQty" inputmode="numeric" min="1" step="1" type="number" value="1"/><div class="actions"><button onclick="cancelPending()">キャンセル</button><button class="primary" id="confirmButton" onclick="commitPending()">確定</button></div></div><div class="bar"><input id="manual" placeholder="コード手入力"/><button onclick="handleCode(document.getElementById('manual').value)">確定</button></div><button onclick="stopScan();show('home')">スキャン終了</button></section><section class="hidden" id="history"><h3>操作履歴</h3><div id="logs"></div></section><section class="hidden" id="settings"><h3>データ管理</h3><p class="muted">JSONバックアップは手動で出力します。ブラウザ内の変更は自動保存されます。</p><button onclick="exportJson()">JSONを書き出す</button><label>JSONを読み込む（現在のデータと置換）</label><input accept=".json,application/json" id="import" onchange="importJson(event)" type="file"/><div class="panel"><b>バックアップ確認</b><p class="muted" id="backupState">バックアップ未確認</p><button onclick="exportJson()">JSONバックアップを作成</button></div><p class="muted">ZXingは初回オンライン接続で読み込みます。カメラにはHTTPSまたはlocalhostが必要です。</p></section></main><nav class="bottom"><button onclick="stopScan();show('home')">在庫</button><button class="primary" onclick="show('scan');startScan()">スキャン</button><button onclick="stopScan();show('history')">履歴</button><button onclick="stopScan();show('settings')">設定</button></nav><script>
const $=id=>document.getElementById(id);let frameCanvas=document.createElement('canvas'),db,items=[],logs=[],mode='buy',stream=null,detector=null,scanning=false,lastCode='',lastTime=0,scanBusy=false,pending=null,reader=null,scanSession=0,seenCodes=new Set(),absentFrames=0;const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function cancelPending(){pending=null;$('confirmBox').classList.add('hidden');$('status').textContent='キャンセルしました。次のコードを読み取れます';}
async function handleCode(raw){const code=String(raw??'').trim();if(!code||scanBusy||pending)return;const now=Date.now();if(seenCodes.has(code))return;if(code===lastCode&&now-lastTime<1800)return;lastCode=code;lastTime=now;seenCodes.add(code);const x=items.find(x=>x.code===code);if(!x){$('status').textContent='未登録コード: '+code;toast('未登録コードです');stopScan();resetForm(code);show('edit');return}const n=Number($('delta').value);if(!validQty(n))return toast('変更数量を確認してください');pending={code,id:x.id,mode};$('confirmName').textContent=x.name;$('confirmStock').textContent=`現在庫: ${x.quantity} / ${mode==='buy'?'購入（加算）':'使用（減算）'}`;$('confirmQty').value=n;$('confirmButton').textContent=mode==='buy'?'購入を確定':'使用を確定';$('confirmBox').classList.remove('hidden');$('status').textContent='数量を確認して確定してください';navigator.vibrate?.(35)}
async function commitPending(){if(!pending||scanBusy)return;const n=Number($('confirmQty').value),p=pending;if(!validQty(n))return toast('数量は1以上の整数で入力してください');const x=items.find(x=>x.id===p.id);if(!x)return cancelPending();if(p.mode==='use'&&x.quantity<n)return toast('在庫不足です');scanBusy=true;const before=x.quantity;const oldLogs=logs;x.quantity+=p.mode==='buy'?n:-n;logs=[{at:new Date().toISOString(),type:p.mode,id:x.id,name:x.name,before,after:x.quantity,delta:n},...logs];try{await persist();pending=null;$('confirmBox').classList.add('hidden');$('status').textContent=`保存済み: ${x.name} ${before} → ${x.quantity}`;navigator.vibrate?.(60)}catch(e){x.quantity=before;logs=oldLogs;toast('保存失敗。再試行してください')}finally{scanBusy=false}}
async function startScan(){if(stream)return;setMode(mode);const session=++scanSession;seenCodes.clear();absentFrames=0;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPSで開く必要があります');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(session!==scanSession){stream.getTracks().forEach(t=>t.stop());stream=null;return}$('video').srcObject=stream;await $('video').play();scanning=true;if('BarcodeDetector'in window){const formats=await BarcodeDetector.getSupportedFormats();const wanted=['qr_code','data_matrix','ean_13','ean_8','code_128','upc_a','upc_e','pdf417','aztec'].filter(f=>formats.includes(f));if(wanted.length){detector=new BarcodeDetector({formats:wanted});$('status').textContent='カメラ読み取り中（標準エンジン）';scanLoop(session);return}}if(window.ZXing?.BrowserMultiFormatReader){reader=new ZXing.BrowserMultiFormatReader();$('status').textContent='カメラ読み取り中（ZXing）';scanLoopZXing(session);return}throw Error('読み取りライブラリを利用できません。ネット接続を確認してください')}catch(e){$('status').textContent='カメラ起動失敗: '+e.message;stopScan()}}
function registerVisible(codes){const visible=new Set(codes);if(!visible.size){if(++absentFrames>=4){seenCodes.clear();absentFrames=0}}else{absentFrames=0;for(const code of [...seenCodes])if(!visible.has(code))seenCodes.delete(code)}}
async function scanLoop(session){while(scanning&&session===scanSession){try{const found=await detector.detect($('video'));const codes=found.map(f=>String(f.rawValue||'').trim()).filter(Boolean);registerVisible(codes);if(codes.length)await handleCode(codes[0])}catch(e){}await new Promise(r=>setTimeout(r,180))}}
async function scanLoopZXing(session){while(scanning&&session===scanSession){try{const result=await reader.decodeOnceFromVideoElement($('video'));if(session!==scanSession)break;const code=result?.getText?.();if(code){registerVisible([code]);await handleCode(code)}}catch(e){await new Promise(r=>setTimeout(r,250));registerVisible([])}}}
function stopScan(){scanSession++;scanning=false;pending=null;$('confirmBox').classList.add('hidden');reader?.reset?.();reader=null;stream?.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;lastCode='';lastTime=0;seenCodes.clear()}
function renderLogs(){$('logs').innerHTML=logs.slice(0,300).map(x=>`<div class="item"><div><b>${escapeHtml(x.name)}</b><div class="muted">${new Date(x.at).toLocaleString('ja-JP')} / ${escapeHtml(x.type)}</div></div><div>${x.before??'—'} → ${x.after??'—'}</div></div>`).join('')||'<p>履歴なし</p>'}
function exportJson(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),items,logs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stocklite-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validateBackup(data){if(!data||typeof data!=='object'||Array.isArray(data)||data.version!==1||!Array.isArray(data.items)||!Array.isArray(data.logs))throw Error('バックアップ形式・バージョンが不正です');if(data.items.length>100000||data.logs.length>500000)throw Error('データ件数が上限を超えています');const ids=new Set(),codes=new Set();for(const x of data.items){if(!x||typeof x!=='object'||typeof x.id!=='string'||!x.id||ids.has(x.id)||typeof x.name!=='string'||!x.name.trim()||typeof x.code!=='string'||!Array.isArray(x.tags)||x.tags.length>100||!x.tags.every(t=>typeof t==='string')||!Number.isSafeInteger(x.quantity)||x.quantity<0||x.quantity>1000000000)throw Error('品目データまたはIDが不正です');if(x.code&&codes.has(x.code))throw Error('コードが重複しています');ids.add(x.id);if(x.code)codes.add(x.code)}for(const x of data.logs){if(!x||typeof x!=='object'||typeof x.at!=='string'||!Number.isFinite(Date.parse(x.at))||typeof x.type!=='string'||!['buy','use','edit','create','delete'].includes(x.type)||typeof x.id!=='string'||typeof x.name!=='string'||(x.before!==null&&(!Number.isSafeInteger(x.before)||x.before<0))||(x.after!==null&&(!Number.isSafeInteger(x.after)||x.after<0))||(x.delta!==undefined&&!validQty(x.delta)))throw Error('履歴データが不正です')}return true}
async function importJson(e){const f=e.target.files?.[0];if(!f)return;try{if(f.size>40*1024*1024)throw Error('ファイルが大きすぎます');const data=JSON.parse(await f.text());validateBackup(data);if(!confirm('現在の全データを置き換えますか？'))return;const prevItems=items,prevLogs=logs;items=data.items;logs=data.logs;try{await persist()}catch(err){items=prevItems;logs=prevLogs;throw err}render();toast('読み込み完了')}catch(err){toast('読み込み失敗: '+err.message)}finally{e.target.value=''}}
init().catch(e=>alert('データベース起動失敗: '+e.message));
</script></body></html>
