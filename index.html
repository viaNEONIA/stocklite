"seenCodes.clear();lastCode='';handleCode(document.getElementById('manual').value)">確定</button></div><label for="scanImage">画像からコードを読み取る（カメラが使えない場合）</label><input id="scanImage" type="file" accept="image/*" onchange="decodeImage(event)"><button onclick="stopScan();show('home')">スキャン終了</button></section><section class="hidden" id="history"><h3>操作履歴</h3><div id="logs"></div><div class="panel hidden" id="logEditor"><h3>履歴編集</h3><p class="muted">履歴の変更・削除は現在庫に影響しません。</p><label>日時</label><input id="logAt" type="datetime-local"/><label>対象品目</label><input id="logName"/><label>操作内容</label><select id="logType"><option value="buy">購入</option><option value="use">使用</option><option value="create">登録</option><option value="edit">編集</option><option value="delete">削除</option></select><label>数量（記録用）</label><input id="logDelta" type="number" min="1" step="1"/><div class="actions"><button onclick="closeLogEditor()">キャンセル</button><button class="primary" onclick="saveLogEdit()">保存</button><button onclick="deleteLogEdit()">削除</button></div></div></section><section class="hidden" id="settings"><h3>データ管理</h3><label for="retention">履歴の保存期間</label><select id="retention" onchange="changeRetention(this.value)"><option value="forever">無期限</option><option value="30">30日</option><option value="90">90日</option><option value="180">180日</option><option value="365">365日</option></select><p class="muted" id="retentionInfo">既存データは設定変更まで削除しません。</p><p class="muted">JSONバックアップは手動で出力します。ブラウザ内の変更は自動保存されます。</p><button onclick="exportJson()">JSONを書き出す</button><label>JSONを読み込む（現在のデータと置換）</label><input accept=".json,application/json" id="import" onchange="importJson(event)" type="file"/><div class="panel"><b>バックアップ確認</b><p class="muted" id="backupState">バックアップ未確認</p><button onclick="exportJson()">JSONバックアップを作成</button></div><p class="muted">ZXingは初回オンライン接続で読み込みます。カメラにはHTTPSまたはlocalhostが必要です。</p></section></main><nav class="bottom"><button onclick="stopScan();show('home')">在庫</button><button onclick="show('scan' function render(){const q=$('search').value.toLowerCase();$('summary').textContent=`${items.length}品目 / 合計 ${items.reduce((a,x)=>a+x.quantity,0)}個`;$('list').innerHTML=items.filter(x=>[x.name,x.code,...x.tags].join(' ').toLowerCase().includes(q)).map(x=>`<div class="item"><div class="item-main"><b>${escapeHtml(x.name)}</b><div class="tags">${x.tags.map(escapeHtml).join(' / ')}</div><div class="muted">${escapeHtml(x.code)}</div></div><div class="qty">${x.quantity}</div><div class="item-actions">${safeUrl(x.url)?`<a aria-label="${escapeHtml(x.name)}のURLを開く" href="${escapeHtml(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer" style="padding:10px" onclick="event.stopPropagation()">🔗</a>`:''}<button data-edit="${escapeHtml(x.id)}">編集</button></div></div>`).join('')||'<p class="muted">該当する品目はありません</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editItem(b.dataset.edit))}

function renderLogs(){$('logs').innerHTML=logs.slice(0,300).map((x,i)=>`<div class="item"><div><b>${escapeHtml(x.name)}</b><div class="muted">${new Date(x.at).toLocaleString('ja-JP')} / ${escapeHtml(x.type)}</div></div><div>${x.before??'—'} → ${x.after??'—'}</div><button class="log-edit" data-log="${i}">編集</button></div>`).join('')||'<p>履歴なし</p>';document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>openLogEditor(Number(b.dataset.log)))}
function exportJson(){const blob=new Blob([JSON.stringify({version:2,settings:{retention},exportedAt:new Date().toISOString(),items,logs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stocklite-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validateBackup(data){if(!data||typeof data!=='object'||Array.isArray(data)||![1,2].includes(data.version)||!Array.isArray(data.items)||!Array.isArray(data.logs))throw Error('バックアップ形式・バージョンが不正です');if(data.items.length>100000||data.logs.length>500000)throw Error('データ件数が上限を超えています');const ids=new Set(),codes=new Set();for(const x of data.items){if(!x||typeof x!=='object'||typeof x.id!=='string'||!x.id||ids.has(x.id)||typeof x.name!=='string'||!x.name.trim()||typeof x.code!=='string'||!Array.isArray(x.tags)||x.tags.length>100||!x.tags.every(t=>typeof t==='string')||!Number.isSafeInteger(x.quantity)||x.quantity<0||x.quantity>1000000000)throw Error('品目データまたはIDが不正です');if(x.url!==undefined&&x.url!==''&&!safeUrl(x.url))throw Error('URLが不正です');if(x.code&&codes.has(x.code))throw Error('コードが重複しています');ids.add(x.id);if(x.code)codes.add(x.code)}for(const x of data.logs){if(!x||typeof x!=='object'||typeof x.at!=='string'||!Number.isFinite(Date.parse(x.at))||typeof x.type!=='string'||!['buy','use','edit','create','delete'].includes(x.type)||typeof x.id!=='string'||typeof x.name!=='string'||(x.before!==null&&(!Number.isSafeInteger(x.before)||x.before<0))||(x.after!==null&&(!Number.isSafeInteger(x.after)||x.after<0))||(x.delta!==undefined&&!validQty(x.delta)))throw Error('履歴データが不正です')}return true}
async function importJson(e){const f=e.target.files?.[0];if(!f)return;try{if(f.size>40*1024*1024)throw Error('ファイルが大きすぎます');const data=JSON.parse(await f.text());validateBackup(data);if(!confirm('現在の全データを置き換えますか？'))return;const prevItems=items,prevLogs=logs,prevRetention=retention;items=data.items;logs=data.logs;retention=['forever','30','90','180','365'].includes(data.settings?.retention)?data.settings.retention:'forever';try{await persist()}catch(err){items=prevItems;logs=prevLogs;retention=prevRetention;throw err}$('retention').value=retention;render();toast('読み込み完了')}catch(err){toast('読み込み失敗: '+err.message)}finally{e.target.value=''}}

function safeUrl(value){if(typeof value!=='string'||!value.trim())return '';try{const u=new URL(value.trim());return ['https:','http:'].includes(u.protocol)&&u.hostname?u.href:''}catch{return ''}}
function closeLogEditor(){logEditingIndex=-1;$('logEditor').classList.add('hidden')}
function openLogEditor(i){const x=logs[i];if(!x)return;logEditingIndex=i;const d=new Date(x.at);const local=new Date(d.getTime()-d.getTimezoneOffset()*60000);$('logAt').value=local.toISOString().slice(0,16);$('logName').value=x.name;$('logType').value=['buy','use','create','edit','delete'].includes(x.type)?x.type:'edit';$('logDelta').value=x.delta||'';$('logEditor').classList.remove('hidden');$('logEditor').scrollIntoView({behavior:'smooth',block:'nearest'})}
async function saveLogEdit(){const i=logEditingIndex,x=logs[i];if(!x)return;const at=new Date($('logAt').value),name=$('logName').value.trim(),raw=$('logDelta').value,n=raw===''?undefined:Number(raw);if(!Number.isFinite(at.getTime())||!name||n!==undefined&&(!Number.isSafeInteger(n)||n<1))return toast('入力値を確認してください');if(!confirm('履歴を修正します。現在庫は変更されません。続けますか？'))return;const prev=logs;logs=logs.map((v,j)=>j===i?{...v,at:at.toISOString(),name,type:$('logType').value,...(n===undefined?{delta:undefined}:{delta:n})}:v);try{await persist();closeLogEditor();renderLogs();toast('履歴を保存しました')}catch(e){logs=prev;toast('保存失敗')}}
async function deleteLogEdit(){const i=logEditingIndex;if(!logs[i]||!confirm('この履歴を削除しますか？ 現在庫は変更されません。'))return;const prev=logs;logs=logs.filter((_,j)=>j!==i);try{await persist();closeLogEditor();renderLogs();toast('履歴を削除しました')}catch(e){logs=prev;toast('保存失敗')}}
async function changeRetention(v){if(!['forever','30','90','180','365'].includes(v))return;const old=retention;if(v!=='forever'){const count=logs.filter(x=>Date.parse(x.at)<Date.now()-Number(v)*86400000).length;if(!confirm(`保存期間を${v}日に設定します。期限超過の履歴${count}件が削除されます。現在庫は変わりません。続けますか？`)){$('retention').value=old;return}}const oldLogs=logs;retention=v;try{await pruneLogs();await persist();toast('保存期間を更新しました')}catch(e){logs=oldLogs;retention=old;$('retention').value=old;toast('設定保存失敗')}}
async function pruneLogs(){if(retention==='forever')return;const threshold=Date.now()-Number(retention)*86400000;const old=logs;logs=logs.filter(x=>Date.parse(x.at)>=threshold);if(logs.length!==old.length){try{await persist()}catch(e){logs=old;throw e}}}


let decoderPromise=null;
async function loadImageDecoder(){
 if(window.ZXing?.BrowserMultiFormatReader)return true;
 if(decoderPromise)return decoderPromise;
 decoderPromise=new Promise(resolve=>{
  const script=document.createElement('script');let done=false;
  const finish=ok=>{if(done)return;done=true;clearTimeout(timer);if(!ok){script.remove();decoderPromise=null}resolve(ok)};
  const timer=setTimeout(()=>finish(false),12000);
  script.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
  script.onload=()=>finish(!!window.ZXing?.BrowserMultiFormatReader);
  script.onerror=()=>finish(false);document.head.appendChild(script);
 });return decoderPromise;
}
async function decodeImage(e){const file=e.target.files?.[0];if(!file)return;const url=URL.createObjectURL(file);try{if(!await loadImageDecoder())throw Error('画像読み取りライブラリを取得できません');const img=new Image();img.src=url;await img.decode();const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;canvas.getContext('2d').drawImage(img,0,0);const reader=new ZXing.BrowserMultiFormatReader();const result=await reader.decodeFromImageUrl(canvas.toDataURL('image/png'));handleCode(result.getText());}catch(err){$('status').textContent='画像の読み取りに失敗しました。コードを手入力してください。'}finally{URL.revokeObjectURL(url);e.target.value=''}}
window.addEventListener('pagehide',()=>{if(stream)stopScan()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream)stopScan()});if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}

init().catch(e=>alert('データベース起動失敗: '+e.message));
</script></body></html>
